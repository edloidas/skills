schema_version: "1.1"
name: routing-sharpen
tags: [routing]
expected_outcome: "sharpen"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do make this prompt sharper before I hand it to someone: \"add caching to the count thing so it's faster\""
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:sharpen)"'
