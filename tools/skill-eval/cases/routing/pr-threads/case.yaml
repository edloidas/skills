schema_version: "1.1"
name: routing-pr-threads
tags: [routing]
expected_outcome: "pr-review"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do answer the review comments on my PR 51 and fix what they're right about"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:pr-review)"'
