schema_version: "1.1"
name: routing-issue-writer
tags: [routing]
expected_outcome: "issue-writer"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do write this up as an issue for later: count.sh ignores stdin"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:issue-writer)"'
