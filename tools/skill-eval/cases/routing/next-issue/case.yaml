schema_version: "1.1"
name: routing-next-issue
tags: [routing]
expected_outcome: "next-issue"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do what should I pick up next?"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:next-issue)"'
