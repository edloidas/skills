schema_version: "1.1"
name: routing-live-probe
tags: [routing]
expected_outcome: "live-probe"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do does count.sh really print 0 for an empty file? run it and show me, don't change anything"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:live-probe)"'
