schema_version: "1.1"
name: routing-ci-audit
tags: [routing]
expected_outcome: "ci-audit"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do audit the GitHub Actions setup"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:ci-audit)"'
