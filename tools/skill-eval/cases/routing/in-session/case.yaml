schema_version: "1.1"
name: routing-in-session
tags: [routing]
expected_outcome: "in session"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do fix the typo 'recieve' in scripts/count.sh"
context:
  scaffold_script: setup.sh
graders:
  - name: no-skill
    type: tool_used
    tool: Skill
    min: 0
    max: 0
  - name: route-line
    type: regex
    target: trace
    flags: i
    pattern: 'Route:\W*in session'
