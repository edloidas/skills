schema_version: "1.1"
name: routing-orchestrate
tags: [routing]
expected_outcome: "orchestrate"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do add stdin support, a --lines flag and a --words flag to count.sh, each as its own PR stacked on the previous one; I want to be able to stop halfway and resume tomorrow"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:orchestrate)"'
