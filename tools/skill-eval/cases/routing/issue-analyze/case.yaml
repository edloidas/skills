schema_version: "1.1"
name: routing-issue-analyze
tags: [routing]
expected_outcome: "issue-analyze"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do what would issue #12 take? the text is in issue-12.md. don't build anything, just plan it out"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:issue-analyze)"'
