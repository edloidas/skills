schema_version: "1.1"
name: routing-pr-triage
tags: [routing]
expected_outcome: "pr-triage"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do what pull requests are waiting on me?"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:pr-triage)"'
