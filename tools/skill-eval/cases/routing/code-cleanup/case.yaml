schema_version: "1.1"
name: routing-code-cleanup
tags: [routing]
expected_outcome: "code-cleanup"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do tidy up count.sh — the comments and the conventions, the behaviour is fine"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:code-cleanup)"'
