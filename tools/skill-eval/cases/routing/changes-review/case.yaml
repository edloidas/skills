schema_version: "1.1"
name: routing-changes-review
tags: [routing]
expected_outcome: "changes-review"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do find what's wrong with my staged change to count.sh — don't fix anything, just list it"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:changes-review)"'
