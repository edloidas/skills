schema_version: "1.1"
name: routing-write-runbook
tags: [routing]
expected_outcome: "live-probe write-runbook"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do write down how an agent should run and check this project, so the next session doesn't have to guess"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '(?=[\s\S]*edloidas:live-probe)(?=[\s\S]*write-runbook)'
