schema_version: "1.1"
name: routing-explain
tags: [routing]
expected_outcome: "explain"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do why does count.sh pipe wc through tr?"
context:
