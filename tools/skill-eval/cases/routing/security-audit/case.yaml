schema_version: "1.1"
name: routing-security-audit
tags: [routing]
expected_outcome: "security-audit"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do check this repo's supply chain and secrets hygiene"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:security-audit)"'
