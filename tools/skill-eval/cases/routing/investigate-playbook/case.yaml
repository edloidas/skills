schema_version: "1.1"
name: routing-investigate-playbook
tags: [routing]
expected_outcome: "investigate playbook"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do when did count.sh start stripping the spaces from wc, and who added it?"
context:
  scaffold_script: setup.sh
graders:
  - name: playbook
    type: regex
    target: trace
    pattern: 'Route:\W*references/investigate\.md|skills/do/references/investigate\.md'
