schema_version: "1.1"
name: routing-tests-audit
tags: [routing]
expected_outcome: "tests-audit"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do are the tests in this repo actually worth anything?"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:tests-audit)"'
