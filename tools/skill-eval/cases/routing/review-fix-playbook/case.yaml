schema_version: "1.1"
name: routing-review-fix-playbook
tags: [routing]
expected_outcome: "review-fix playbook"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do look over my staged changes to count.sh and fix whatever is wrong with them"
context:
  scaffold_script: setup.sh
graders:
  - name: playbook
    type: regex
    target: trace
    pattern: 'Route:\W*references/review-fix\.md|skills/do/references/review-fix\.md'
