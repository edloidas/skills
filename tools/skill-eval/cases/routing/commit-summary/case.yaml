schema_version: "1.1"
name: routing-commit-summary
tags: [routing]
expected_outcome: "commit-summary"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do write the commit message body for what's staged"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:commit-summary)"'
