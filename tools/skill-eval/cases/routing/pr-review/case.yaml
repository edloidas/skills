schema_version: "1.1"
name: routing-pr-review
tags: [routing]
expected_outcome: "pr-review"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "/edloidas:do review PR 51"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:pr-review)"'
