schema_version: "1.1"
name: live-perf
tags: [live]
expected_outcome: "do perf playbook: 5+ alternating timed runs, median and range, one kept change in merchants.js"
execution:
  max_turns: 50
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, AskUserQuestion, Edit, Write, Bash]
  prompt: "/edloidas:do `node bin/merchants.js examples/year.txt` takes most of a second on a 30k-line ledger. make it faster"
context:
  scaffold_script: setup.sh
graders:
  - name: route-perf
    type: regex
    target: trace
    pattern: 'Route:\W*(?:`)?references/perf\.md'
  - name: merchants-edited
    type: tool_used
    tool: Edit
    input_match: 'bin/merchants\.js'
    min: 1
  - name: median-reported
    type: regex
    target: trace
    pattern: 'median'
    flags: i
  - name: calendar-untouched
    type: tool_used
    tool: Edit
    input_match: 'src/calendar\.js'
    min: 0
    max: 0
  - name: no-issue-filed
    type: tool_used
    tool: Bash
    input_match: 'gh (?:issue|pr) (?:create|comment|edit)'
    min: 0
    max: 0
