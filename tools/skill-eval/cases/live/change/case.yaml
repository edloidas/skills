schema_version: "1.1"
name: live-change
tags: [live]
expected_outcome: "do change playbook: --json flag implemented, tests pass, nothing else widened"
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, AskUserQuestion, Edit, Write, Bash]
  prompt: "/edloidas:do add a --json flag to bin/total.js that prints the total and the number of entries as JSON, like {\"total\":\"43.50\",\"entries\":4}"
context:
  scaffold_script: setup.sh
graders:
  - name: route-change
    type: regex
    target: trace
    pattern: 'Route:\W*(?:`)?references/change\.md'
  - name: total-edited
    type: tool_used
    tool: Edit
    input_match: 'bin/total\.js'
    min: 1
  - name: calendar-untouched
    type: tool_used
    tool: Edit
    input_match: 'src/calendar\.js'
    min: 0
    max: 0
  - name: no-issue-filed
    type: tool_used
    tool: Bash
    input_match: 'gh (?:issue|pr) (?:create|comment|edit)'
    min: 0
    max: 0
