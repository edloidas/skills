schema_version: "1.1"
name: live-do-issue-false
tags: [live]
expected_outcome: "do on a local issue file whose stated cause is false: the repro shows the last line is kept; parseAmount is fixed instead"
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, AskUserQuestion, Edit, Write, Bash]
  prompt: "/edloidas:do fix the bug described in issue-17.md"
context:
  scaffold_script: setup.sh
graders:
  - name: amount-edited
    type: tool_used
    tool: Edit
    input_match: 'src/amount\.js'
    min: 1
  - name: calendar-untouched
    type: tool_used
    tool: Edit
    input_match: 'src/calendar\.js'
    min: 0
    max: 0
  - name: no-issue-filed
    type: tool_used
    tool: Bash
    input_match: 'gh (?:issue|pr) (?:create|comment|edit)'
    min: 0
    max: 0
