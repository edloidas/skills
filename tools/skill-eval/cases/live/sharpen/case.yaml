schema_version: "1.1"
name: live-sharpen
tags: [live]
expected_outcome: "sharpen on a vague task: four answers, a fenced rewrite with placeholders, Left to you; no work started"
execution:
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, AskUserQuestion]
  prompt: "/edloidas:sharpen make the ledger tools better"
context:
  scaffold_script: setup.sh
graders:
  - name: three-parts
    type: regex
    target: last_message
    pattern: 'Before rewriting[\s\S]*Sharpened prompt[\s\S]*Left to you'
