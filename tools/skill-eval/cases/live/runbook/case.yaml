schema_version: "1.1"
name: live-runbook
tags: [live]
expected_outcome: "live-probe write-runbook: Running and observing section in AGENTS.md, steps proven, server stopped"
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, AskUserQuestion, Edit, Write, Bash]
  prompt: "/edloidas:live-probe write-runbook"
context:
  scaffold_script: setup.sh
graders:
  - name: section-written
    type: regex
    target: { source: file, path: AGENTS.md }
    pattern: 'Running and observing'
  - name: server-started
    type: tool_used
    tool: Bash
    input_match: 'npm start|src/server\.js'
    min: 1
