schema_version: "1.1"
name: live-review-fix
tags: [live]
expected_outcome: "do review-fix playbook: changes-review finds the empty-ledger NaN, the flag-order crash and floor-vs-round; fixes them"
execution:
  max_turns: 40
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, AskUserQuestion, Edit, Write, Bash]
  prompt: "/edloidas:do review my uncommitted changes and fix whatever is wrong with them"
context:
  scaffold_script: setup.sh
graders:
  - name: route-review-fix
    type: regex
    target: trace
    pattern: 'Route:\W*(?:`)?references/review-fix\.md'
  - name: changes-review-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:changes-review"'
  - name: calendar-untouched
    type: tool_used
    tool: Edit
    input_match: 'src/calendar\.js'
    min: 0
    max: 0
  - name: no-issue-filed
    type: tool_used
    tool: Bash
    input_match: 'gh (?:issue|pr) (?:create|comment|edit)'
    min: 0
    max: 0
