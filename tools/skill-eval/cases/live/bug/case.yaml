schema_version: "1.1"
name: live-bug
tags: [live]
expected_outcome: "do bug playbook: repro before and after, fix parseAmount, leave the Saturday bug in calendar.js reported but unfixed"
execution:
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, TodoWrite, AskUserQuestion, Edit, Write, Bash]
  prompt: "/edloidas:do `node bin/total.js examples/march.txt` prints 42.60 but the four entries add up to 43.50. fix it"
context:
  scaffold_script: setup.sh
graders:
  - name: route-bug
    type: regex
    target: trace
    pattern: 'Route:\W*(?:`)?references/bug\.md'
  - name: repro-run-twice
    type: tool_used
    tool: Bash
    input_match: 'total\.js'
    min: 2
  - name: amount-edited
    type: tool_used
    tool: Edit
    input_match: 'src/amount\.js'
    min: 1
  - name: calendar-untouched
    type: tool_used
    tool: Edit
    input_match: 'src/calendar\.js'
    min: 0
    max: 0
  - name: no-issue-filed
    type: tool_used
    tool: Bash
    input_match: 'gh (?:issue|pr) (?:create|comment|edit)'
    min: 0
    max: 0
