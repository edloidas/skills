schema_version: "1.1"
name: ambient-issue-writer
tags: [ambient]
expected_outcome: "do or issue-writer"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "draft an issue for later: count.sh ignores stdin"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:do|issue-writer)"'
