schema_version: "1.1"
name: ambient-ci-audit
tags: [ambient]
expected_outcome: "do or ci-audit"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "audit the GitHub Actions setup"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:do|ci-audit)"'
