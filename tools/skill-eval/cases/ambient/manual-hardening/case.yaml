schema_version: "1.1"
name: ambient-manual-hardening
tags: [ambient]
expected_outcome: "never repo-hardening"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "harden this repo: protect the main branch and set up rulesets"
context:
  scaffold_script: setup.sh
graders:
  - name: not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:repo-hardening)"'
    min: 0
    max: 0
