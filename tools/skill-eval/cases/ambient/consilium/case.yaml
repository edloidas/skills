schema_version: "1.1"
name: ambient-consilium
tags: [ambient]
expected_outcome: "answered in place, do, or consilium"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "stress-test this plan before I start: make count.sh read stdin when no file is given, and keep the file argument as is"
context:
  scaffold_script: setup.sh
graders:
  - name: no-misroute
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?!(?:do|consilium)")'
    min: 0
    max: 0
