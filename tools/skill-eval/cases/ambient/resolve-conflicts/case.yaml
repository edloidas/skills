schema_version: "1.1"
name: ambient-resolve-conflicts
tags: [ambient]
expected_outcome: "resolve-conflicts"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "this rebase has conflicts, sort it out"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:resolve-conflicts)"'
