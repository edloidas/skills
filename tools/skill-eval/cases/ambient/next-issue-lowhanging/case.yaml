schema_version: "1.1"
name: ambient-next-issue-lowhanging
tags: [ambient]
expected_outcome: "do or next-issue"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "any low hanging fruit in the backlog? give me a few easy issues, not assigned to anyone or assigned to me"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:do|next-issue)"'
