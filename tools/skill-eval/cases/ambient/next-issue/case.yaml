schema_version: "1.1"
name: ambient-next-issue
tags: [ambient]
expected_outcome: "do or next-issue"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "what should I pick up next?"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:do|next-issue)"'
