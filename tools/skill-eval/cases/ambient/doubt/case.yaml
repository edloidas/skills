schema_version: "1.1"
name: ambient-doubt
tags: [ambient]
expected_outcome: "answered in place, do, or doubt"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "double check these findings before I fix anything: count.sh breaks on paths with spaces, and set -eu makes it exit non-zero on an empty file"
context:
  scaffold_script: setup.sh
graders:
  - name: no-misroute
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?!(?:do|doubt)")'
    min: 0
    max: 0
