schema_version: "1.1"
name: ambient-do-bare
tags: [ambient]
expected_outcome: "do"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "do it: count.sh should print nothing for an empty file, like the README says"
context:
  scaffold_script: setup.sh
graders:
  - name: route
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:do)"'
