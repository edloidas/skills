schema_version: "1.1"
name: ambient-explain
tags: [ambient]
expected_outcome: "answered in place, or explain"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "why does count.sh pipe wc through tr?"
context:
  scaffold_script: setup.sh
graders:
  - name: no-misroute
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?!(?:explain)")'
    min: 0
    max: 0
