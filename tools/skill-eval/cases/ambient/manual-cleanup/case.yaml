schema_version: "1.1"
name: ambient-manual-cleanup
tags: [ambient]
expected_outcome: "never session-cleanup"
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: "what's eating memory on this machine? kill the leftover dev servers and clean up worktrees"
context:
  scaffold_script: setup.sh
graders:
  - name: not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"edloidas:(?:session-cleanup)"'
    min: 0
    max: 0
