name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

# One run per tag. `cancel-in-progress` is deliberately false: this job creates a
# GitHub Release, and cancelling that halfway leaves a tag with no release rather
# than a clean retry.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate Claude marketplace and source plugins
        run: bash .github/scripts/validate-skills.sh

      - name: Validate Codex compatibility contract
        run: ./scripts/validate-codex.sh

      - name: Verify generated Codex wrapper files
        run: |
          ./scripts/skills-packaging.sh sync-repo
          git diff --exit-code

      - name: Run bundled-script tests
        run: bash tests/run.sh

      - name: Validate version consistency
        run: bash .github/scripts/validate-version.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" --generate-notes
