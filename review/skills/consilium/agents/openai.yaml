interface:
  display_name: "Consilium"
  short_description: "Approach board — generate candidate approaches, attack them comparatively, recommend one"
  default_prompt: "Use $consilium to run an approach board on this decision: generate candidate approaches from independent seats, attack the candidate set comparatively, verify the surviving objections, and recommend one with its trade-offs. Change nothing."
policy:
  allow_implicit_invocation: false
